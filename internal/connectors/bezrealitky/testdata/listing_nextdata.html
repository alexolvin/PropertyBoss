,\"filename\":\"K\\u00fcche3a.JPG\",\"description\":\"K\\u00fcche\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/64046\\/picture\\/5\\/full.jpg?id=1126548\"},{\"type\":\"FOTO\",\"position\":6,\"filename\":\"K\\u00fcche4a.JPG\",\"description\":\"K\\u00fcche\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/64046\\/picture\\/6\\/full.jpg?id=1126549\"},{\"type\":\"FOTO\",\"position\":7,\"filename\":\"K\\u00fcche5a.JPG\",\"description\":\"K\\u00fcche\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/64046\\/picture\\/7\\/full.jpg?id=1126550\"},{\"type\":\"FOTO\",\"position\":8,\"filename\":\"Schl1.JPG\",\"description\":\"Schlafzimmer\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/64046\\/picture\\/8\\/full.jpg?id=1126551\"},{\"type\":\"FOTO\",\"position\":9,\"filename\":\"Schl2.JPG\",\"description\":\"Schlafzimmer\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/64046\\/picture\\/9\\/full.jpg?id=1126554\"},{\"type\":\"FOTO\",\"position\":10,\"filename\":\"IMG_0195.JPG\",\"description\":\"Bad\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/64046\\/picture\\/10\\/full.jpg?id=98104910\"},{\"type\":\"FOTO\",\"position\":11,\"filename\":\"IMG_0201.JPG\",\"description\":\"Bad\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/64046\\/picture\\/11\\/full.jpg?id=98104915\"},{\"type\":\"FOTO\",\"position\":12,\"filename\":\"IMG_0216.JPG\",\"description\":\"Bad\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/64046\\/picture\\/12\\/full.jpg?id=98104916\"}],\"private_offer\":true,\"omOriginalDescription\":\"1 Wohnzimmer mit Schlafcouch (f. 2 Personen), 1 Schlafzimmer (Durchgangszimmer) mit Doppelbett, K\\u00fcche, Bad, Flur, voll m\\u00f6bliert und komplett ausgestattet (Betten, Handt\\u00fccher, Flachbild-TV etc.). Die hochwertige Einbauk\\u00fcche wurde 2016 neu errichtet (mit Induktionskochfeld, Einbaubackofen, Geschirrsp\\u00fcler, Waschmaschine, K\\u00fchlschrank, Espressovollautomat, allen Kleinger\\u00e4ten) und ist komplett best\\u00fcckt mit Koch-\\/Essgeschirr und -besteck f\\u00fcr 6 Personen.\\r\\nDie Wohnung liegt zentral (2 Minuten zu U-Bahn, Bus, S-Bahn), aber im sehr ruhigen zweiten, frei stehenden Seitenfl\\u00fcgel mit Blick auf einen gro\\u00dfen Garten, offen gen S\\u00fcden (kein abschlie\\u00dfendes Quergeb\\u00e4ude). Da nur drei weitere Parteien in dem Haus wohnen, herrscht vor den Fenstern im Erdgeschoss wenig Betrieb. Alle Fenster sind mit Roll\\u00e4den ausgestattet (im Schlafzimmer elektrisch betrieben).\\r\\nDie Zentralheizung ist neu und sehr effizient.\\r\\nDie fixe Miete schlie\\u00dft ein: Nebenkosten, Strom, Rundfunkgeb\\u00fchren, Telefonanschluss mit schnellem WLAN und LAN (16.000), Vollm\\u00f6blierung und Komplettausstattung, Hausratsversicherung. Bei Bedarf k\\u00f6nnen M\\u00f6blierung und Ausstattung nach Absprache angepasst werden. \\r\\nTwo connected rooms (lounge with sleeper couch and bedroom), ground floor, quiet with garden view, new built-in kitchen with hightech installations, all public transport systems within walking distance, fully furnished and equipped, monthly rental covers all costs, including fast WIFI + cable (16000),  electricity, hot \\/ cold water, heating, insurance.\\nsehr verkehrsg\\u00fcnstig: U-Bahnhof Alt-Tempelhof vor der T\\u00fcr, Stadtautobahnanschluss und S-Bahn 500 Meter entfernt, \\u00f6ffentliche Parkm\\u00f6glichkeiten in unmittelbarer Umgebung\\r\\n\\r\\nAccess to underground and metro train stations, bus stops within walking distance (2 minutes), as well as shopping, pharmacies, doctors\\ngro\\u00dfz\\u00fcgige hochwertige neue Einbauk\\u00fcche mit Esstisch f\\u00fcr zwei Personen - Wohnzimmer mit Esstisch f\\u00fcr 4 Personen, Schlafcouch, TV-Flachbildschirm auf -wagen, DVD-Spieler, Couchtisch, B\\u00fccherregal, kleinem Arbeitstisch (f\\u00fcr PC etc.), WLAN-Drucker, Kleiderschrank - Schlafzimmer mit einem Doppelbett (1.50x2.00m), gro\\u00dfem Nachttisch, 2 Kommoden - Flur mit Garderobe und Gestell f\\u00fcr Schuhe, Einbauregal mit Werkzeug, Erstehilfekasten - Bad mit Wanne \\/ Dusche, aufmontiertem Spritzschutz, kleinen Abstellregalen, Matten. Teppiche liegen im Wohnzimmer, Flur und Schlafzimmer. Diverse Bilder \\/ Gem\\u00e4lde k\\u00f6nnen f\\u00fcr die Dauer der Miete entfernt werden. \\r\\n\\r\\nfully equipped kitchen with built in new high tech oven, stove, dishwasher, washing machine, all glasses, china ware, cuttlery, pots - twin bed and sofa convertible into twin bed, tables, chairs, flat screen TV, wifi printer \\/ scanner, cupboards, carpets, bedding, towels ...\\nMietbeginn kann alternativ der 01.11.2026 sein.\\r\\nDa ich die Wohnung au\\u00dferhalb der Zeiten einer Untervermietung selber nutze und anschlie\\u00dfend wieder anderen Interessenten anbieten m\\u00f6chte, ist mir eine pflegliche Behandlung der Einrichtung und Ausstattung sehr wichtig.\\r\\nNach Vereinbarung wird die Wohnung alle 14 Tage ca. 3 Stunden professionell gereinigt. Die Kosten in H\\u00f6he von insgesamt 102 Euro sind mit der Monatsmiete zu \\u00fcberweisen.\\r\\n\\r\\nDie Genehmigung der Eigent\\u00fcmer zur Untervermietung liegt vor.\\r\\nBei Vertragsabschluss erbitte ich eine Vorauszahlung in H\\u00f6he von 1.140 Euro auf die ersten 1,5 Monatsmieten und bei Vertragsbeginn eine Kaution in H\\u00f6he von 1.200 Euro, die nach Auszug zur\\u00fcckgezahlt wird, falls keine nennenswerten Sch\\u00e4den festgestellt werden. Die tats\\u00e4chlichen Energie- und Wasserkosten werden in der Endabrechnung festgestellt. Wenn die tats\\u00e4chlichen Kosten niedriger ausfallen, zahle ich die Differenz zur\\u00fcck. Bei h\\u00f6heren Verbrauchsrechnungen muss ich leider eine entsprechende Nachzahlung fordern.\\r\\nDie beh\\u00f6rdliche Anmeldung des Wohnsitzes ist m\\u00f6glich.\\r\\nErstkontakt bitte nur per E-Mail, mit Informationen zu Besch\\u00e4ftigung, Einkommen \\/ Bankguthaben, Ausweispapieren, m\\u00f6glichst mit Dokumenten, Schufa-Auskunft und Stellungnahmen bisheriger Vermieter - danke.\\r\\n\\r\\nThe alternative date to beginn the contract could be 01.11.2026.\\r\\nWhen I don't sublet I use the apartment myself, so proper care is a priority. Dates and rental are negotiable, depending length of stay and other criteria. A downpayment of 1-1.140 Euro for the first 1,5 rental fees is due when signing the contract, and a security deposit of 1.200 Euro for possible damages when receiving the keys. It will be refunded  after vacating the apartment and returning the keys. The real costs of energy and water will be determined at the end of the rental period. In case of lower or higher consumption I refund the difference or request an additional payment.\\r\\nFinal cleaning will be 80 Euro. By agreement the apartment will be cleaned professionally twice a month for appr. 3 hours. The total additional cost of 102 Euro for this service is payable with the monthly rental. \\r\\nOfficial registration of residence is possible.\\r\\nFor first contact please use email message, with information about occupation, income \\/ financial assets, preferably with documentation of ID \\/ passport + residence permit and statement of financial stability (\\\"Schufa\\\"), if possible with an evaluation of previous rental agreements - Thanks.\\r\\n\\r\\nI speak English well - hablo espanol basico\"}","shortTerm":true},"Image:28136920":{"__typename":"Image","id":"28136920","url({\"filter\":\"RECORD_THUMB\"})":"https://api.bezrealitky.cz/media/cache/record_thumb/data/images/advert/1065k/1065755/ohnemaklert48t3gr89mvs2yynqzw.jpg%3Fid%3D101195938","size({\"filter\":\"RECORD_MAIN\"})":null,"url({\"filter\":\"RECORD_MAIN\"})":"https://api.bezrealitky.cz/media/cache/record_main/data/images/advert/1065k/1065755/ohnemaklert48t3gr89mvs2yynqzw.jpg%3Fid%3D101195938","type":null,"originalImage":null},"Image:28136921":{"__typename":"Image","id":"28136921","size({\"filter\":\"RECORD_MAIN\"})":null,"url({\"filter\":\"RECORD_MAIN\"})":"https://api.bezrealitky.cz/media/cache/re 2115a.jpeg\",\"description\":\"\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/85955\\/picture\\/0\\/full.jpg?id=101195938\"},{\"type\":\"FOTO\",\"position\":1,\"filename\":\"edec6fb8-679f-4a9d-9db5-925f93dcb028.jpeg\",\"description\":\"\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/85955\\/picture\\/1\\/full.jpg?id=101195937\"},{\"type\":\"FOTO\",\"position\":2,\"filename\":\"e41f2554-d383-47c7-8c8a-6d980396223a.jpeg\",\"description\":\"\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/85955\\/picture\\/2\\/full.jpg?id=101195940\"},{\"type\":\"FOTO\",\"position\":3,\"filename\":\"c74646f6-23c4-4944-9aaa-22472972851f.jpeg\",\"description\":\"\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/85955\\/picture\\/3\\/full.jpg?id=101195941\"},{\"type\":\"FOTO\",\"position\":4,\"filename\":\"0645646d-d8b8-4b92-9313-b3ce22a9fb63.jpeg\",\"description\":\"\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/85955\\/picture\\/4\\/full.jpg?id=101195939\"}],\"private_offer\":true,\"omOriginalDescription\":\"Bitte unbedingt vollst\\u00e4ndig lesen!\\r\\nDas unm\\u00f6blierte Appartement befindet sich im Duisburger S\\u00fcden, Stadtteil Gro\\u00dfenbaum. Die Wohnfl\\u00e4che betr\\u00e4gt 45qm und befindet sich im 1. Obergescho\\u00df. Die Wohnung ist ausschlie\\u00dflich als Single-Wohnung geeignet. Der Wohnraum ist gro\\u00dfz\\u00fcgig geschnitten, so dass der Wohn- und Schlafbereich optisch gut voneinander getrennt werden kann. Auf dem gro\\u00dfen angrenzenden Balkon kann man ab mittags die Sonne genie\\u00dfen. Im Wohn-Schlafraum und in der Diele wurde Laminatboden neu verlegt. In der Diele befindet sich ein gro\\u00dfer Einbauschrank. Die K\\u00fcche ist ein separater Raum.  Das Badezimmer ist mit Badewanne ausgestattet. In allen R\\u00e4umen wurde ein hochwertiger Laminat und Vinylboden neu verlegt.\\r\\nEin Kellerraum geh\\u00f6rt zur Wohnung.\\r\\n\\r\\nDas Appartement bietet sich insbesondere f\\u00fcr Single, Rentner u. Studenten an. Einkaufsm\\u00f6glichkeiten in der unmittelbaren Nachbarschaft. Der Bahnhof ist in wenigen Gehminuten erreichbar. Hunde und Katzen sind leider nicht erlaubt, WM 451,67 EUR, Kaution 3 Kaltmieten, nach Absprache zu vermieten\\r\\n\\r\\nWenn Sie einen Besichtigungstermin vereinbaren m\\u00f6chten, nutzen Sie bitte das Kontaktformular. Bitte geben Sie Ihre Kontaktdaten an: Name, Vorname, aktuelle Wohnadresse, Emailadresse,  sowie Telefonnummer zwecks R\\u00fcckruf uns gew\\u00fcnschter Einzugstermin, Haushaltsgr\\u00f6\\u00dfe, Tiere im Haushalt\\r\\n\\r\\nEine Kontaktaufnahme bzw. Vereinbarung des Besichtigungstermins kommt nur zustande, wenn u.a. alle oben genannten Daten im Kontaktformular angegeben wurden. \\r\\n\\r\\nVor Abschlu\\u00df eines Mietvertrages sind dann folgende Unterlagen vorzulegen:\\r\\nEinkommensnachweis der letzten 3 Monate, Mietschuldenfreiheitsbest\\u00e4tigung, aktuelle Schufa-Auskunft, Solvenz-Check durch Haus und Grund, freiwillige Mieter-Selbstauskunft, Nachweis der letzten 3 Mietzahlungen, Kopie des Personalausweises\\r\\n\\r\\nMakleranfragen sowie Anfragen \\u00fcber Dritte sind nicht erw\\u00fcnscht und werden nicht ber\\u00fccksichtigt! Bitte geben Sie zwecks R\\u00fcckruf unbedingt Ihre Telefonnummer an. Besichtigungstermin werden ausschlie\\u00dflich telefonisch vereinbart!\\nDas beliebte Naherholungsgebiet Sechs-Seen-Platte befindet sich ganz in der N\\u00e4he. Die HSPV NRW ist mit der S-Bahn nur 3 Haltestellen entfernt. Sehr gute Verkehrsanbindungen mit der Bahn Richtung Duisburg-Stadtmitte, D\\u00fcsseldorf, und M\\u00fclheim, sehr gute Verkehrsanbindungen mit dem Auto Richtung Duisburg-Stadtmitte, D\\u00fcsseldorf, M\\u00fclheim, Essen, Ratingen, Krefeld, M\\u00fclheim (A59, A524, B288, A57, A40, A52)\\nDas Appartement ist mit Rauhfaser tapeziert und wurde mit neuem, hochwertigen Laminat,- u. Vinylboden ausgestattet.\\nBitte geben Sie zwecks R\\u00fcckruf f\\u00fcr eine Terminabsprache unbedingt Ihre Telefonnummer an. Besichtigungstermine werden ausschlie\\u00dflich telefonisch vereinbart!\\r\\n\\r\\nMakleranfragen sowie Anfragen \\u00fcber Dritte sind nicht erw\\u00fcnscht und werden nicht ber\\u00fccksichtigt!\"}","shortTerm":false},"Image:28136913":{"__typename":"Image","id":"28136913","url({\"filter\":\"RECORD_THUMB\"})":"https://api.bezrealitky.cz/media/cache/record_thumb/data/images/advert/1065k/1065754/ohnemakler490km19a9ako93obv1e.jpg%3Fid%3D24775340","size({\"filter\":\"RECORD_MAIN\"})":null,"url({\"filter\":\"RECORD_MAIN\"})":"https://api.bezrealitky.cz/media/cache/record_main/data/images/advert/1065k/1065754/ohnemakler490km19a9ako93obv1e.jpg%3Fid%3D24775340","type":null,"originalImage":null},"Image:28136914":{"__typename":"Image","id":"28136914","size({\"filter\":\"RECORD_MAIN\"})":null,"url({\"filter\":\"RECORD_MAIN\"})":"https://api.bezrealitky.cz/media/cache/record_main/data/images/advert/1065k/1065754/ohnemaklercjavqmbg44ljfo50f11.jpg%3Fid%3D24775360","type":null,"originalImage":null},"Image:28136915":{"__typename":"Image","id":"28136915","size({\"filter\":\"RECORD_MAIN\"})":null,"url({\"filter\":\"RECORD_MAIN\"})":"https://api.bezrealitky.cz/media/cache/record_main/data/images/advert/1065k/1065754/ohnemakler1lq2ib4206ivfxm3ati.jpg%3Fid%3D24775361","type":null,"originalImage":null},"Advert:1065754":{"__typename":"Advert","id":"1065754","uri":"1065754-nabidka-pronajem-bytu-weinberg-8-wuppertal","estateType":"BYT","offerType":"PRONAJEM","disposition":"DISP_1_1","landType":"UNDEFINED","imageAltText({\"locale\":\"CS\"})":"Pronájem bytu 1+1 26 m², Weinberg 8, Wuppertal","mainImage":{"__ref":"Image:28136913"},"publicImages({\"limit\":3})":[{"__ref":"Image:28136913"},{"__ref":"Image:28136914"},{"__ref":"Image:28136915"}],"address({\"locale\":\"CS\"})":"Weinberg 8 Wuppertal Uellendahl-Katernberg Nordrhein-Westfalen 42109","surface":26,"surfaceLand":null,"tags({\"locale\":\"CS\"})":[],"price":240,"charges":160,"currency":"EUR","petFriendly":null,"reserved":false,"highlighted "type\":\"FOTO\",\"position\":8,\"filename\":\"IMG_4000.JPG\",\"description\":\"K\\u00fcche\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/129686\\/picture\\/8\\/full.jpg?id=35372700\"},{\"type\":\"FOTO\",\"position\":9,\"filename\":\"IMG_3991.JPG\",\"description\":\"Bad en Suite\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/129686\\/picture\\/9\\/full.jpg?id=35372691\"},{\"type\":\"FOTO\",\"position\":10,\"filename\":\"IMG_3990.JPG\",\"description\":\"Bad en Suite\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/129686\\/picture\\/10\\/full.jpg?id=35372690\"},{\"type\":\"FOTO\",\"position\":11,\"filename\":\"IMG_4001.JPG\",\"description\":\"Schlafzimmer\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/129686\\/picture\\/11\\/full.jpg?id=35372701\"},{\"type\":\"FOTO\",\"position\":12,\"filename\":\"IMG_4002.JPG\",\"description\":\"Schlafzimmer\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/129686\\/picture\\/12\\/full.jpg?id=35372702\"},{\"type\":\"FOTO\",\"position\":13,\"filename\":\"IMG_4013.JPG\",\"description\":\"Garten\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/129686\\/picture\\/13\\/full.jpg?id=35372703\"},{\"type\":\"FOTO\",\"position\":14,\"filename\":\"IMG_4012.JPG\",\"description\":\"Terrasse\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/129686\\/picture\\/14\\/full.jpg?id=35372881\"}],\"private_offer\":true,\"omOriginalDescription\":\"Die angebotene Mietwohnung ist zwar eine Souterrain-Wohnung, durch die Hanglage ist die Wohnung aber im Wohnbereich eher eine Erdgescho\\u00df-Wohnung. Die R\\u00e4ume sind gro\\u00dfz\\u00fcgig und hell.\\r\\n\\r\\nDas Badezimmer der Wohnung ist en Suite, also direkt vom Schlafzimmer, oder \\u00fcber die Diele begehbar. Wanne und Dusche sind vorhanden. Eine Einbauk\\u00fcche ist ebenfalls vorhanden.\\r\\n\\r\\nDas EG und OG wird durch uns, die Eigent\\u00fcmer, bewohnt. Die Wohnung im UG ist theoretisch sofort frei, gesucht wird allerdings ein Mieter der sp\\u00e4testens zum 01.11.2026 einziehen kann.  \\r\\n\\r\\nDa unsere 3 kleinen Kinder im Haus leben, kommen als Mieter vor allem l\\u00e4rmresistente Mieter in Frage ;-) Sympathie und finanzielle Sicherheit sind uns sehr wichtig. Der Interessent sollte seinen Lebensunterhalt aus eigenen Kr\\u00e4ften finanzieren k\\u00f6nnen. Da wir selbst zwei Katzen haben, kommen Interessenten mit Hund oder Katze leider nicht in Frage.\\r\\n\\r\\nDer Garten, direkt von K\\u00fcche, Wohn- und Schlafzimmer begehbar, kann - je nach Absprache - ganz oder teilweise vom Mieter genutzt werden. Nach Absprache kann der Garten auch gestaltet  und ver\\u00e4ndert werden.\\nDie gepflegte 2-Zimmer-Wohnung befindet sich in ruhiger und angenehmer Ortsrandlage von Karlsruhe-Gr\\u00fcnwettersbach. Die Wohnung liegt in einer Sackgasse. Verkehr gibt es hier quasi nicht. \\r\\n\\r\\nNur 50 Meter vom Haus entfernt beginnt die pure Natur, eine Streuobstwiese die sich \\u00fcber Kilometer erstreckt. Der Weg f\\u00fchrt zum Streuobstlehrpfad. Nach ca. 2 Km erreicht man ein Wildschweingehege. Auch der \\\"Strommastendownhill-Trail\\\" und der Trail \\\"From Dax till Dawan\\\" ist mit dem Fahrrad in 10 Minuten erreichbar. \\r\\n\\r\\nDie N\\u00e4he nach Karlsruhe und zur BAB, sowie den Naherholungsgebieten in unmittelbarer N\\u00e4he zeichnen diese Lage aus. Die verkehrstechnischen Anbindungen, auch \\u00fcber \\u00f6ffentliche Verkehrsmittel, sind gut ausgebaut. Alle Dinge des t\\u00e4glich Bedarfs befinden sich in der N\\u00e4he. Die n\\u00e4chste Bushaltestelle ist zu Fu\\u00df in ca. 8 Minuten erreichbar. Fahrtdauer bis zum Hbf ca. 15 Minuten.\\nDer Zustand der Wohnung ist gut. Nach Absprache k\\u00f6nnten Renovierungen, bis hin zum Einbau eines neuen Bades vorgenommen werden.\\nDie Nebenkosten liegen bei ca. 320 Euro f\\u00fcr eine Person bzw. 370 Euro f\\u00fcr 2 Personen. Darin enthalten Wasser, Heizung und Strom. Der Interessent muss sich also nur noch um Internet\\/Telefon\\/TV selbst k\\u00fcmmern.\"}","shortTerm":false},"Image:28136883":{"__typename":"Image","id":"28136883","url({\"filter\":\"RECORD_THUMB\"})":"https://api.bezrealitky.cz/media/cache/record_thumb/data/images/advert/1065k/1065751/ohnemakler0p8gp5nc55fa76nd39g.jpg%3Fid%3D95642026","size({\"filter\":\"RECORD_MAIN\"})":null,"url({\"filter\":\"RECORD_MAIN\"})":"https://api.bezrealitky.cz/media/cache/record_main/data/images/advert/1065k/1065751/ohnemakler0p8gp5nc55fa76nd39g.jpg%3Fid%3D95642026","type":null,"originalImage":null},"Image:28136884":{"__typename":"Image","id":"28136884","size({\"filter\":\"RECORD_MAIN\"})":null,"url({\"filter\":\"RECORD_MAIN\"})":"https://api.bezrealitky.cz/media/cache/record_main/data/images/advert/1065k/1065751/ohnemakler2ov9556ukvj88r2sfle.jpg%3Fid%3D95642027","type":null,"originalImage":null},"Image:28136885":{"__typename":"Image","id":"28136885","size({\"filter\":\"RECORD_MAIN\"})":null,"url({\"filter\":\"RECORD_MAIN\"})":"https://api.bezrealitky.cz/media/cache/record_main/data/images/advert/1065k/1065751/ohnemakler14e70i53pov8er8cltp.jpg%3Fid%3D95642036","type":null,"originalImage":null},"Advert:1065751":{"__typename":"Advert","id":"1065751","uri":"1065751-nabidka-pronajem-bytu-lange-str-seesen","estateType":"BYT","offerType":"PRONAJEM","disposition":"DISP_4_1","landType":"UNDEFINED","imageAltText({\"locale\":\"CS\"})":"Pronájem bytu 4+1 98 m², Lange Str., Seesen","mainImage":{"__ref":"Image:28136883"},"publicImages({\"limit\":3})":[{"__ref":"Image:28136883"},{"__ref":"Image:28136884"},{"__ref":"Image:28136885"}],"address({\"locale\":\"CS\"})":"Lange Str., , Dolní Sasko","surface":98,"surfaceLand":null,"tags({\"locale\":\"CS\"})":[],"price":686,"charges":155,"currency":"EUR","petFriendly":null,"reserved":false,"highlighted":false,"roommate":false,"project":null,"gps":{"__typename":"GPSPoint","lat":51.88969,"lng":10.17089},"mortgageData({\"locale\":\"CS\"})":{"__typename":"MortgageData","rateLow":null,"rateHigh":null,"loan":null,"years":null},"origin 86314\\/picture\\/5\\/full.jpg?id=95642029\"},{\"type\":\"FOTO\",\"position\":6,\"filename\":\"IMG_20200815_124534381.jpg\",\"description\":\"K\\u00fcche 3\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/186314\\/picture\\/6\\/full.jpg?id=95642030\"},{\"type\":\"FOTO\",\"position\":7,\"filename\":\"IMG_20200815_123547640.jpg\",\"description\":\"Wohnzimmer\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/186314\\/picture\\/7\\/full.jpg?id=95642031\"},{\"type\":\"FOTO\",\"position\":8,\"filename\":\"IMG_20200815_123610764.jpg\",\"description\":\"Esszimmer\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/186314\\/picture\\/8\\/full.jpg?id=95642032\"},{\"type\":\"FOTO\",\"position\":9,\"filename\":\"IMG_20200815_123512318.jpg\",\"description\":\"Wohn- und Esszimmer\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/186314\\/picture\\/9\\/full.jpg?id=95642033\"},{\"type\":\"FOTO\",\"position\":10,\"filename\":\"IMG_20200815_123717999.jpg\",\"description\":\"Schlafzimmer\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/186314\\/picture\\/10\\/full.jpg?id=95642034\"},{\"type\":\"FOTO\",\"position\":11,\"filename\":\"IMG_20200815_123648896.jpg\",\"description\":\"Kinderzimmer\\/B\\u00fcro\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/186314\\/picture\\/11\\/full.jpg?id=95642035\"}],\"private_offer\":true,\"omOriginalDescription\":\"Kernsanierte 4-Zimmerwohnung (98 m2 ) im 1.OG\\r\\nDurch die massive, hochwertige Wohnungseingangst\\u00fcr mit Glaselementen betreten Sie den hellen, freundlichen Wohnungsflur. \\r\\nAuf diesem haben Sie Platz f\\u00fcr einen Schuhschrank sowie eine Garderobe.\\r\\nLinks des Flures befinden sich das Wohnzimmer und das Esszimmer. Beide R\\u00e4ume sind durch einen gro\\u00dfz\\u00fcgigen Durchbruch miteinander verbunden. Am Ende des Flures befindet sich die T\\u00fcr zu einem gro\\u00dfen hellen Raum, der als Kinderzimmer oder als B\\u00fcro geeignet ist. Die drei R\\u00e4ume liegen zur Stra\\u00dfenseite hinaus. Durch die gro\\u00dfen, neuen schallisolierten Fenster sind die R\\u00e4ume sehr hell und sehr ruhig.\\r\\nRechts des Flures befindet sich die gro\\u00dfe helle K\\u00fcche, die Raum f\\u00fcr eine K\\u00fcchenzeile, (ggf. separater Gefrierschrank m\\u00f6glich) und eine gem\\u00fctliche Sitzecke bietet. Vom K\\u00fcchenfenster aus haben Sie einen sch\\u00f6nen Ausblick auf die Burg Sehusa. Ebenfalls rechts des Hauptflures befindet sich das Tageslicht-Duschbad. Im Bad sind die W\\u00e4nde teilweise gefliest, teilweise in baubiologisch hochwertigem Sumpfkalkputz gearbeitet. Hier finden Sie eine Anschlussm\\u00f6glichkeit f\\u00fcr Ihre Waschmaschine. Weitere Ausstattungsmerkmale: flache Duschtasse, Handtuchheizk\\u00f6rper, Spiegelschrank, alles sehr schick. Ebenfalls zur ruhigen Hof- und Gartenseite hin befindet sich das Schlafzimmer. Das Schlafzimmerfenster k\\u00f6nnen Sie mittels Au\\u00dfenjalousie verdunkeln. Der Fu\\u00dfboden im Bad ist gefliest, im Rest der Wohnung besteht er aus hochwertigem, neuwertigem Designbelag in Holzoptik (Eiche hell geb\\u00fcrstet).\\r\\nDie Wohnung ist ausgestattet mit einer neuwertigen Brennwerttherme.\\r\\nDie komplette Elektrik ist neu. In allen R\\u00e4umen wurden neue effiziente Heizk\\u00f6rper installiert.\\r\\nDas Haus verf\\u00fcgt \\u00fcber eine Trinkwasserenth\\u00e4rtungsanlage.\\r\\nDen Mietern des Hauses steht ein ruhiger Garten zur Mitbenutzung zur Verf\\u00fcgung.\\r\\nBei Bedarf besteht die M\\u00f6glichkeit, eine Garage auf dem verschlossenen Garagenhof zu mieten.\\r\\nStrom und Gas direkt vom Versorger.\\nInnenstadtlage, Lange Str. 18, 1. OG\\r\\nDer hinter dem Haus liegende Garten grenzt an den ruhigen Stadtpark an.\\r\\nInfrastruktur (im Umkreis von 5 km):\\r\\nApotheke, Banken, Lebensmittel-Discount, Allgemeinmediziner, Augenarzt, Zahnarzt, Kindergarten, Grundschule, Oberschule, Gymnasium, \\u00d6ffentliche Verkehrsmittel (Bus und Bahn)\\nHeizungsart: Neuwertige Brennwert-Gasetagenheizung\"}","shortTerm":false},"Image:28136853":{"__typename":"Image","id":"28136853","url({\"filter\":\"RECORD_THUMB\"})":"https://api.bezrealitky.cz/media/cache/record_thumb/data/images/advert/1065k/1065750/ohnemaklerojqr8lp7rf3f2ddicws.jpg%3Fid%3D95754531","size({\"filter\":\"RECORD_MAIN\"})":null,"url({\"filter\":\"RECORD_MAIN\"})":"https://api.bezrealitky.cz/media/cache/record_main/data/images/advert/1065k/1065750/ohnemaklerojqr8lp7rf3f2ddicws.jpg%3Fid%3D95754531","type":null,"originalImage":null},"Image:28136854":{"__typename":"Image","id":"28136854","size({\"filter\":\"RECORD_MAIN\"})":null,"url({\"filter\":\"RECORD_MAIN\"})":"https://api.bezrealitky.cz/media/cache/record_main/data/images/advert/1065k/1065750/ohnemaklersm34u3oukf0r0pw5tfl.jpg%3Fid%3D102100483","type":null,"originalImage":null},"Image:28136855":{"__typename":"Image","id":"28136855","size({\"filter\":\"RECORD_MAIN\"})":null,"url({\"filter\":\"RECORD_MAIN\"})":"https://api.bezrealitky.cz/media/cache/record_main/data/images/advert/1065k/1065750/ohnemaklerfl27d7hsd5lr6ibvsnh.jpg%3Fid%3D102100471","type":null,"originalImage":null},"Advert:1065750":{"__typename":"Advert","id":"1065750","uri":"1065750-nabidka-pronajem-bytu-eversbuschstr-30a-allach-untermenzing","estateType":"BYT","offerType":"PRONAJEM","disposition":"DISP_2_KK","landType":"UNDEFINED","imageAltText({\"locale\":\"CS\"})":"Pronájem bytu 2+kk 65 m², Eversbuschstr. 30a, Allach-Untermenzing","mainImage":{"__ref":"Image:28136853"},"publicImages({\"limit\":3})":[{"__ref":"Image:28136853"},{"__ref":"Image:28136854"},{"__ref":"Image:28136855"}],"address({\"locale\":\"CS\"})":"Eversbuschstr. 30a Allach-Untermenzing Untermenzing Bayern 80999","surface":65,"surfaceLand":null,"tags({\"locale\":\"CS\"})":["Garáž"],"price":1200,"charges":220,"currency":"EUR","petFriendly":null,"reserved":false,"highlighted":false,"roommate":false,"project":null,"gps":{"__typename":"GPSPoint","lat":48.18042,"lng":11.46142},"mortgageData({\"locale\":\"CS\"})":{"__typename dern sind teilweise noch die alten Fenster zu sehen, hier wurden die Aufnahmen im Sp\\u00e4therbst bei D\\u00e4mmerung aufgenommen).\\r\\nZu der Wohnung geh\\u00f6rt ein ca 10 qm gro\\u00dfes Kellerabteil.\\r\\nIm Haus ist ein Waschraum vorhanden bei dem die eigene Waschmaschine und Trockner angeschlossen werden k\\u00f6nnen.\\nUntermenzing geh\\u00f6rt zu den beliebtesten Wohngegenden der bayerischen Landeshauptstadt. Im Au\\u00dfenbezirk M\\u00fcnchens gelegen, bietet der Stadtteil an derr W\\u00fcrm mit seinen vielen Gr\\u00fcnfl\\u00e4chen, vielf\\u00e4ltige Erholungs- und Freizeitm\\u00f6glichkeiten. Das direkte Umfeld ist von Einfamilien- und kleineren Mehrfamilienh\\u00e4usern auf gepflegten Grundst\\u00fccken gepr\\u00e4gt. Zur S-Bahnstation sind es ca. 500 Meter und die Bushaltestelle liegt ca. 100 m entfernt. Mit dem PKW gelangen Sie in ca. 20 Minuten ins Zentrum M\\u00fcnchens. Alle Einkaufsm\\u00f6glichkeiten, sowie Schulen und Kinderg\\u00e4rten befinden sich in unmittelbarer N\\u00e4he.\\nDie Wohnung ist mit Laminatb\\u00f6den und der K\\u00fcchenbereich, sowie das Badezimmer mit wei\\u00dfen Fliesen ausgestattet.\\r\\nDas Badezimmer (ohne Fenster) verf\\u00fcgt \\u00fcber Wanne, WC.\\r\\n\\u00c4u\\u00dferst praktisch ist die abgeschlossene Abstellkammer.\\r\\n\\r\\nDie Wohnung verf\\u00fcgt \\u00fcber keinen Balkon.\\nDie Wohnung ist bestens f\\u00fcr Singles und Paare geeignet.\\r\\nDie Wohnung k\\u00f6nnte ab sofort bezogen werden oder sp\\u00e4testens am 01.11.2026\\r\\n\\r\\nBitte legen Sie Ihrer Bewerbung eine Mieterselbstauskunft, SCHUFA-Selbstauskunft, Einkommensnachweise (Gehaltsabrechnung der letzten 3 Monate), Mietschuldenfreiheitsbescheinigung (Best\\u00e4tigung des Vormieters \\u00fcber p\\u00fcnktliche Mietzahlungen) und einen Identit\\u00e4tsausweis bei.\\r\\n\\r\\nNur aussagekr\\u00e4ftige Unterlagen werden ber\\u00fccksichtigt.\"}","shortTerm":false},"Image:28136842":{"__typename":"Image","id":"28136842","url({\"filter\":\"RECORD_THUMB \\/9\\/full.jpg?id=99846586\"},{\"type\":\"FOTO\",\"position\":10,\"filename\":\"IMG_5117.jpg\",\"description\":\"Schlafzimmer \\/ Flur\",\"url\":\"https:\\/\\/cdn.ohne-makler.net\\/immobilie\\/226295\\/picture\\/10\\/full.jpg?id=101770235\"}],\"private_offer\":true,\"omOriginalDescription\":\"Bei dieser Immobilie handelt es sich um ein denkmalgesch\\u00fctztes, kernsaniertes, schickes Stadthaus aus dem Baujahr 1898 in der Neusser Innenstadt.\\r\\n\\r\\nAusstattung: Hierbei handelt es sich um eine 2-Zimmerwohnung im 2. OG. Die Grundrisse von Vor- und Hinterhaus wurden architektonisch optimiert und etagenweise mit einer stilvollen Geb\\u00e4udeverbindung \\u00fcber einzelne Verbindungstufen, zusammengelegt. Die R\\u00e4ume sind hoch, hell und lichtdurchflutet. Der Bodenbelag ist mit Parkett ausgestattet, bzw. gro\\u00dffl\\u00e4chigen Fliessen im Badbereich. Das hochwertige, moderne Badezimmer ist mit einer bodentiefen Duschkeramik versehen und neuen Armaturen best\\u00fcckt. \\r\\n\\r\\nAlle W\\u00e4nde und Decken sind glatt gespachtelt und weiss gestrichen. Der Originalstuck in dieser Wohnung ist instandgesetzt worden. Moderne Heizungsanlage mit W\\u00e4rmemengenerfassunsger\\u00e4ten ist vorhanden. Die Elektrounterverteilung ist auf neuestem Stand. Alle Rohrleitungen wurden erneuert. K\\u00fcchenanschl\\u00fcsse sind vorger\\u00fcstet.\\r\\n\\r\\nDer Wohnung zugeh\\u00f6rig ist ein Kellerraum.\\r\\n\\r\\nAufgrund der Bauweise des denkmalgesch\\u00fctzen Stadthauses ist kein Fahrstuhl vorhanden und auch keine Barrierefreiheit gew\\u00e4hrleistet.\\nDie Stadt Neuss ist mit den ca. 155.000 Einwohnern, einer sehr guten Wirtschaftsstruktur und der N\\u00e4he zu D\\u00fcsseldorf und K\\u00f6ln eine sehr beliebte Gro\\u00dfstadt, die immer mehr Bewohner findet. Die Lage des Stadthauses liegt im Amtsgerichtviertel und ist dadurch ideal (zentral + ruhig) und bietet eine hervorragende Anbindung an Ihren Arbeitsplatz, Einkaufs- und Freizeitm\\u00f6glichkeiten, Gastronomiebetriebe und Parkanlagen. \\r\\n\\r\\nDie n\\u00e4chste Stra\\u00dfenbahnhaltestelle und Bushaltestelle liegt in ca. 600m auf der Oberstra\\u00dfe. Der Neusser Hauptbahnhof befindet sich nur ca. 10 Gehminuten vom Objekt entfernt und bietet gute Anschl\\u00fcsse nach D\\u00fcsseldorf, Krefeld, K\\u00f6ln und Grevenbroich bzw. M\\u00f6nchengladbach.\\r\\n\\r\\nDie D\\u00fcsseldorfer Innenstadt erreichen Sie mit der Stra\\u00dfenbahn in ca. 20 Minuten. Der Flughafen ist mit der S-Bahn in ca. 30 Minuten erreichbar. Die n\\u00e4chste Autobahnauffahrt befindet sich nur ca. 2 km vom Objekt entfernt.\\nDie hochwertige K\\u00fcchenzeile kann \\u00fcbernommen werden. Eine \\u00dcbernahmeabsprache erfolgt durch den Vormieter.\"}","shortTerm":false},"Image:28136764":{"__typename":"Image","id":"28136764","url({\"filter\":\"RECORD_THUMB\"})":"https://api.bezrealitky.cz/media/cache/record_thumb/data/images/advert/1065k/1065739/ohnemakler09p30i919tjc3tb85za.jpg%3Fid%3D98620422","size({\"filter\":\"RECORD_MAIN\"})":null,"url({\"filter\":\"RECORD_MAIN\"})":"https://api.bezrealitky.cz/media/cache/record_main/data/images/advert/1065k/1065739/ohnemakler09p30i919tjc3tb85za.jpg%3Fid%3D98620422","type":null,"originalImage":null},"Image:28136765":{"__typename":"Image","id":"28136765","size({\"filter\":\"RECORD_MAIN\"})":null,"url({\"filter\":\"RECORD_MAIN\"})":"https://api.bezrealitky.cz/media/cache/record_main/data/images/advert/1065k/1065739/ohnemakler5i6rnu5jhrk97cyrop3.jpg%3Fid%3D98620423","type":null,"originalImage":null},"Image:28136766":{"__typename":"Image","id":"28136766","size({\"filter\":\"RECORD_MAIN\"})":null,"url({\"filter\":\"RECORD_MAIN\"})":"https://api.bezrealitky.cz/media/cache/record_main/data/images/advert/1065k/1065739/ohnemaklergpho28k5urc756mersn.jpg%3Fid%3D98620419","type":null,"originalImage":null},"Advert:1065739":{"__typename":"Advert","id":"1065739","uri":"1065739-nabidka-pronajem-bytu-muhlenstrasse-2-rethem","estateType":"BYT","offerType":"PRONAJEM","disposition": on \\r\\nBalkon Nord-West. Parkplatz abgewandte Seite Burgblick\\r\\n\\r\\n\\r\\nHier entstanden 33 Barriere Freie Wohnungen je 3 freistehenden Mehrfamilienh\\u00e4usern mit 11 Wohneinheiten.\\r\\n\\r\\nEtagen: Eg, 1.OG, 2.OG, Staffelgescho\\u00df (Penthouse)\\r\\n\\r\\nEg, 1.OG, 2.OG sind jeweils identisch vom Grundriss mit je 3 Wohnungen pro Etage.\\r\\n\\r\\nBei dieser ansprechenden Wohnung handelt es sich um einen zweit Bezug. Der Mieter zieht aus pers\\u00f6nlichen Gr\\u00fcnden n\\u00e4her zur Arbeitsst\\u00e4tte. Die Wohnung ist ab sofort bezugsfertig.\\r\\n\\r\\nDie Wohnung verf\\u00fcgt \\u00fcber drei sch\\u00f6ne Zimmer. Durch einen Fahrstuhl gelangen Sie bequem ins entsprechende Stockwerk und das Objekt ist barrierefrei zug\\u00e4nglich. Besonders hervorzuheben ist, dass es nicht nur eine Terasse gibt, sondern Sie auch den Garten des Hauses mitbenutzen k\\u00f6nnen. Zur Verf\\u00fcgung steht Ihnen au\\u00dferdem ein Stellplatz.\\r\\n\\r\\nDie Kaltmiete pro qm netto Betr\\u00e4gt in den Unteren Etagen (EG-2.OG 10,30\\u20ac netto),\\nDie Immobilie liegt in Nideggen. In Laufn\\u00e4he des Objekts sind mehrere Buslinien vorhanden. \\u00dcberregionale Ziele sind durch die nahe verkehrende Bahnlinie RB21 gut erreichbar. In n\\u00e4herer Umgebung finden Sie ein paar Restaurants, Caf\\u00e9s, zwei B\\u00e4ckereien und einen Arzt. Auch zwei Apotheken, eine Gr\\u00fcn- und Parkanlage, eine Buchhandlung, ein Museum und eine Postannahmestelle sind gut zu Fu\\u00df erreichbar. Weiter entfernt finden Sie zudem mehrere Einkaufsm\\u00f6glichkeiten, Schulen und einen Kindergarten. Diverse Erholungs- und Sportm\\u00f6glichkeiten erreichen Sie schlie\\u00dflich ebenfalls im gr\\u00f6\\u00dferen Umkreis.\"}","shortTerm":false},"Image:28136637":{"__typename":"Image","id":"28136637","url({\"filter\":\"RECORD_THUMB\"})":"https://api.bezrealitky.cz/media/cache/record_thumb/data/images/advert/1065k/1065730/ohnemaklerqcm5n2qkfuo4fdjsjys.jpg%3Fid%3D102100912","size({\"filter\":\"R cture\\/17\\/full.jpg?id=99167128\"}],\"private_offer\":true,\"omOriginalDescription\":\"Dieses ausgesprochen sch\\u00f6ne und helle Zimmer befindet sich im Erdgeschoss eines solide komplett neu-modernisierten Hauses mit insgesamt nur drei Einheiten. Besonders hervorzuheben ist die Lage in einem ruhigen famili\\u00e4ren Wohnviertel welche aber trotzdem sehr zentral liegt\\r\\nEine Wohnung die keine W\\u00fcnsche offen l\\u00e4sst. Eine gro\\u00dfe wundersch\\u00f6ne Terrasse , modernes Bad, Parkettboden und eine gute Aufteilung warten darauf Ihr neues Zuhause zu werden.\\nDie Wohnung befindet sich fussl\\u00e4ufig 5 Minuten vom Ortskern Trudering entfernt mit all den Annehmlichkeiten die man sich w\\u00fcnscht. Direkt in der n\\u00e4heren Umgebung erstreckt sich der idyllische Truderinger Wald. Die Wohnung befindet sich im beliebten Stadtteil Trudering, s\\u00fcd\\u00f6stlich der Innenstadt, nahe der Verbindungsstra\\u00dfe zum Stadtteil Riem. Der Stadtteil umfasst den \\u00f6stlichen Bereich M\\u00fcnchens. Im Westen grenzt er an Berg am Laim sowie Bogenhausen, im S\\u00fcden an Ramersdorf-Perlach, im Norden an Johanneskirchen und im Osten an mehrere Gemeinden des Landkreises M\\u00fcnchen. Alle Einkaufsm\\u00f6glichkeiten f\\u00fcr den t\\u00e4glichen Bedarf, wie Banken, \\u00c4rzte und Apotheken sind fu\\u00dfl\\u00e4ufig in wenigen Minuten erreichbar. Kinderg\\u00e4rten, Grundschulen, Sport und viele Freizeitm\\u00f6glichkeiten sowie diverse Gr\\u00fcnanlagen sind in der n\\u00e4heren Umgebung. U- sowie S-Bahn erreicht man in 15 Gehminuten. Die Fahrzeit zur M\\u00fcnchner Innenstadt betr\\u00e4gt ca. 20 Minuten mit der U-Bahn.\"}","shortTerm":false}},"withChatBot":false,"withFooter":false},"__N_SSP":true},"page":"/search/[[...list]]","query":{"list":["nabidka-pronajem","byt"]},"buildId":"d9e03cc2ef747d92c3d0ec13ba47fe87430195f9","isFallback":false,"isExperimentalCompile":false,"gssp":true,"locale":"cs","locales":["cs","en","sk"],"defaultLocale":"cs","domainLocal
