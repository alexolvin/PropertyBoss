# Пример конфигурации PropertyBoss.
# Скопируйте в config/config.yaml (в git не коммитится) и заполните.
#
# Регламент ТЗ §0.1: каждый порог/коэффициент обязан иметь источник значения.
# Пороги delisted (этап 6, §8.2), гедонической модели (этап 5, §7.3)
# и модели ликвидности (этап 7, §9) — ниже, с источниками значений.

database:
  # PostgreSQL 16 + PostGIS на vzu5-claw (ТЗ §2, этап 1)
  dsn: "postgres://propertyboss:CHANGE_ME@127.0.0.1:5432/propertyboss?sslmode=disable"

dashboard:
  # Слушатель API для веб-дашборда (ТЗ §10). Только локальный хост:
  # дашборд работает на той же машине, внешний доступ не предусмотрен.
  # 8090: на vzu5-claw порт 8080 занят другим сервисом (проверено 2026-08-25);
  # на чистой машине допустим любой свободный.
  listen: "127.0.0.1:8090"
  # Целевые рынки (ТЗ §1): Чехия, Италия, Нидерланды.
  # Валюта рынка — валюта, в которой цена хранится и считается моделью (ТЗ §5).
  countries: [CZ, IT, NL]
  market_currencies:
    CZ: CZK
    IT: EUR
    NL: EUR
  deal_types: [sale, rent]

# Дедупликация объявлений (ТЗ §8.1): сопоставление записей из разных
# источников в один физический объект. ТЗ: «радиус — из конфига по стране
# (плотная европейская застройка и пригород требуют разного)».
dedupe:
  by_country:
    # radius_m: 50 — «радиус 50 м из v1 сохраняется» (ТЗ §8.1).
    # area_tolerance_pct: 10 — допущение исполнителя (этап 3), менять здесь.
    # address_similarity: 0.9 — порог сходства нормализованных адресов;
    # совпадение только по адресу → match_confidence='low' (ТЗ §8.1).
    CZ: { radius_m: 50, area_tolerance_pct: 10, address_similarity: 0.9 }
    IT: { radius_m: 50, area_tolerance_pct: 10, address_similarity: 0.9 }
    NL: { radius_m: 50, area_tolerance_pct: 10, address_similarity: 0.9 }

# Сканер (этап 3): параметры вежливости при обходе страниц источника.
scan:
  # Пауза между запросами страниц категории, мс. Источник значения:
  # оператор — вежливый уровень для публичного сайта (ТЗ §0.1, §13).
  # 0 — пауза отключена (не рекомендуется).
  page_delay_ms: 1000

# Гедоническая модель (этап 5, ТЗ §7.2–7.3). ТЗ §7.3: пороги — в конфиге,
# не в коде.
valuation:
  # Минимум наблюдений на параметр. ТЗ §7.3: «отраслевой ориентир — от 10
  # наблюдений на параметр»; 10 — нижняя граница ориентира.
  min_obs_per_param: 10
  # Зона с числом активных наблюдений меньше этого берёт zone_effect с
  # родительского уровня (zone_fallback=true, ТЗ §7.3). Допущение
  # исполнителя: 30 (полугодовой цикл OMI — данных мало по определению).
  min_obs_per_zone: 30
  # Порог доли пропусков по ключевому (used_in_pricing) атрибуту, (0,1]:
  # превышение — модель не выдаёт результат (ТЗ §7.3). Допущение: 0.5.
  max_missing_rate: 0.5
  # Число складок k-fold CV для подбора λ (ТЗ §7.2: «λ подбирается
  # k-fold кросс-валидацией, а не назначается»). Допущение: 5.
  kfold: 5
  # Кандидаты λ для гребневой регуляризации, по возрастанию. Допущение:
  # стандартная логарифмическая сетка; регуляризация обязательна
  # (ТЗ §7.2: национальные атрибуты сильно коллинеарны).
  lambda_grid: [0.01, 0.1, 1, 10, 100]

# Delisted-логика (этап 6, ТЗ §8.2). Исчезновение из выдачи — не продажа:
# статус delisted ставится только по правилам ниже.
delist:
  # Сколько ПОСЛЕДОВАТЕЛЬНЫХ полных сканов без объекта нужно, чтобы
  # считать его исчезнувшим. ТЗ §8.2: «минимум 2» (1 неполный скан или
  # один сбой источника не должны «продавать» объект).
  min_consecutive_misses: 2
  # Защита от катастрофы (ТЗ §8.2): если за один прогон исчезает больше
  # этого процента активных объектов источника — прогон считается
  # аномальным: изменения не применяются, оператор уведомляется.
  # Допущение исполнителя: 25 (смена вёрстки сайта «продаёт» всю базу
  # разом — 25% за один прогон уже аномалия, а не естественный отток).
  max_delisted_share_pct: 25
  # Таймаут прямого URL-чека объявления перед delisted, с (ТЗ §8.2,
  # защита 4). 404/410 подтверждает исчезновение, живой список — объект
  # остаётся активным.
  url_check_timeout_sec: 10

# Модель ликвидности (этап 7, ТЗ §9): дискретная модель дожития на
# недельных person-period интервалах. Выход — вероятность ухода с рынка
# (НЕ продажи, §9.3), а не «коэффициент продаваемости».
liquidity:
  # Минимум завершённых наблюдений (объектов, ушедших с рынка) до
  # обучения модели. ТЗ §9.3: «пока не накоплено min_events —
  # hazard_probability = NULL с причиной insufficient_history».
  # Допущение исполнителя: 100 (с ~30 параметрами модели 100 событий —
  # нижняя граница осмысленного пулированного обучения).
  min_events: 100
  # Порог калибровки (ТЗ §9.4): модель публикуется, только если
  # максимальное отклонение калибровочной кривой по децилям предсказанной
  # вероятности не больше этого; иначе status=uncalibrated, прогноз NULL
  # с причиной calibration_failed, оповещения не отправляются.
  # Допущение исполнителя: 0.10 (10 процентных пунктов).
  max_calib_dev: 0.10
  # Горизонт прогноза T, дней: «вероятность ухода с рынка в ближайшие T
  # дней» (ТЗ §9.2). Недельная дискретизация: P(T) = 1 − ∏(1 − h_w)
  # по первым ceil(T/7) неделям. Допущение исполнителя: 30.
  horizon_days: 30
  # Доля хвоста окна наблюдений для отложенной по времени проверки
  # (ТЗ §9.4: обучение до T, проверка после T; случайное разбиение
  # запрещено — оно перемешивает будущее с прошлым). Допущение: 0.25.
  holdout_ratio: 0.25

# Telegram — доставка уведомлений (этап 8, ТЗ §2). Бот — только
# уведомления, диалога нет. Пока токен не задан (enabled: false),
# очередь notifications накапливается, и `pb notify send` явно
# сообщает, что доставка не настроена — алерты не теряются молча.
telegram:
  enabled: false
  # Токен бота — у @BotFather. Коммитить реальные токены запрещено.
  token: ""
  # Чат оператора (числовой chat_id; у канала — @channel).
  chat_id: ""
  # Зеркало Bot API; дефолт https://api.telegram.org.
  base_url: "https://api.telegram.org"

# Триггеры уведомлений (этап 8, ТЗ §3.2).
notify:
  # Сколько сообщений доставить за один `pb notify send` (cron-точка,
  # ТЗ §3.4). 0 — дефолт 100.
  flush_limit: 100
  # Каталог с данными для проверки свободного места (ТЗ §3.2). Пусто —
  # проверка отключена. На vzu5-omi — каталог Termux с базой и WAL.
  disk_path: ""
  # Свободного места меньше этого процента — алерт ДО критической
  # точки (ТЗ §3.2: «до достижения критического порога»). 10 —
  # допущение исполнителя: WAL-архив и pg_dump должны укладываться
  # с запасом, а не впритык.
  disk_critical_pct: 10
  # Минимальный интервал между повторными алертами о диске, мин.
  # 1440 (сутки) — допущение исполнителя: диск не наполняется
  # заметно за минуты, чаще — шум.
  disk_realert_minutes: 1440

# Адаптивное расписание сканирования (этап 11, ТЗ §10).
schedule:
  # Доля бюджета на исследование (ε, ТЗ §10.3): слот с нулевым выходом
  # не отключается — ему всегда достаётся ε доли веса (иначе система
  # никогда не узнает об изменении режима площадки).
  exploration_fraction: 0.10
  # Окно скользящего среднего выхода, дней (ТЗ §10.3).
  ma_window_days: 14
  # Минимум накопленных полных сканов по источнику, ниже которого
  # расписание работает на равных консервативных весах и помечается
  # warming_up (ТЗ §10.5).
  min_obs_for_tuning: 14
  # Бэкофф по капче/429 (ТЗ §10.4): кулдаун base * multiplier^(strikes-1)
  # с потолком max (последовательные неудачи без полного скана).
  backoff_base_minutes: 60
  backoff_multiplier: 2
  backoff_max_hours: 72
  # Постепенное восстановление: rate_factor (множитель потолка
  # max_requests_per_hour) падает вдвое при входе в кулдаун и
  # повышается на recovery_step при каждом полном скане до 1.0.
  recovery_step: 1.5
  min_rate_factor: 0.25
  # Часовой пояс страны объявления, IANA (ТЗ §10.2 — не сервера).
  country_timezones:
    CZ: Europe/Prague
    IT: Europe/Rome
    NL: Europe/Amsterdam

# Асинхронный переводчик описаний (этап 10, ТЗ §11). Переводы ru/en
# хранятся в object_translations, UI читает из БД (без обращения к LLM).
# Идемпотентность — по sha256(description_original): повторный перевод
# того же текста не выполняется, повторные траты при пересканировании
# исключены. Cron-точка: `pb translate run`. Пустой api_key — переводчик
# не настроен, `pb translate run` даёт явную ошибку (переводы NULL).
translate:
  # API-ключ LLM (OpenAI-совместимый API). Коммитить реальные ключи
  # запрещено (config.yaml в .gitignore).
  api_key: ""
  # Базовый URL OpenAI-совместимого API; дефолт https://api.openai.com/v1.
  base_url: "https://api.openai.com/v1"
  # Название модели — выбирает оператор (ТЗ модель не предписывает).
  # Обязателен при заданном api_key.
  model: ""
  # Таймаут запроса к LLM, с.
  timeout_sec: 60
  # Описание длиннее этого числа символов не отправляется в LLM
  # (стоимость в токенах); перевод остаётся NULL (ТЗ §11). Допущение
  # исполнителя: 4000.
  max_chars: 4000

fx:
  # Источник: ежедневные референсные курсы ЕЦБ, XML-фид eurofxref (ТЗ §5).
  # Проверено 2026-08-25 с vzu5-claw:
  #   - SDMX REST API (data-api.ecb.europa.eu) блокируется WAF с IP сервера;
  #   - XML-фид доступен, но только с заголовком User-Agent.
  base_url: "https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml"
  user_agent: "PropertyBoss-FXLoader/1.0 (propertyboss backend)"
  # Глубина истории для первичной загрузки и восстановления после разрыва
  # (допущение: 30 дней, покрывает первое окно накопления наблюдений).
  backfill_days: 30
  # Зеркальный API тех же курсов ЕЦБ (frankfurter.dev, без ключа) для окна
  # бэкфила. Проверено 2026-08-25 с vzu5-claw: собственные эндпоинты ЕЦБ
  # игнорируют параметры from/to с этой сети (отдают один день), прямой
  # XML-канал покрывает только последний опубликованный день. Данные —
  # референсные курсы ЕЦБ; в fx_rates.source путь атрибутируется явно.
  # Необязательно: без него синхронизация идёт только прямым каналом.
  fallback_base_url: "https://api.frankfurter.dev/v1"
