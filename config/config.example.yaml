# Пример конфигурации PropertyBoss.
# Скопируйте в config/config.yaml (в git не коммитится) и заполните.
# Секреты (dsn, telegram.token, api-ключи) — в отдельном файле
# config/secrets.yaml (шаблон: config/secrets.example.yaml); в этот
# файл их класть не нужно — config.Load подмешивает secrets.yaml
# поверх общего конфига.
#
# Регламент ТЗ §0.1: каждый порог/коэффициент обязан иметь источник значения.
# Пороги delisted (этап 6, §8.2), гедонической модели (этап 5, §7.3)
# и модели ликвидности (этап 7, §9) — ниже, с источниками значений.

database:
  # PostgreSQL 16 + PostGIS (ТЗ §2, этап 1).
  # DSN с паролем — в config/secrets.yaml (секреты, не в общий конфиг).

dashboard:
  # Слушатель API и дашборда. По умолчанию — только локальный адрес.
  # У API нет аутентификации: не указывайте 0.0.0.0 и не публикуйте
  # порт в интернет. Чужой адрес машины в этот файл-пример не пишите.
  listen: "127.0.0.1:8091"
  # Каталог собранного фронтенда (в web/: npm run build → web/dist):
  # pb serve раздаёт его тем же портом, что и API — один адрес на UI
  # и API. Пусто — только JSON-API.
  ui: "web/dist"
  # Целевые рынки (ТЗ §1): Чехия, Италия, Нидерланды.
  # Валюта рынка — валюта, в которой цена хранится и считается моделью (ТЗ §5).
  countries: [CZ, IT, NL]
  market_currencies:
    CZ: CZK
    IT: EUR
    NL: EUR
  deal_types: [sale, rent]
  # Карта (TZ UI v5 U31, Р5): светлая векторная подложка. Ключ поставщика
  # не хранится в репозитории; OpenFreeMap — без ключа.
  map:
    style_url: "https://tiles.openfreemap.org/styles/positron"
    points_max: 500          # Р4: total ≤ → точки, иначе ячейки
    max_bbox_deg: 20         # U30: шире — 400 при низком zoom
    min_zoom_wide: 10
    default_lng: 15.5        # центр Чехии (первый рынок)
    default_lat: 49.8
    default_zoom: 7
    zone_color_min_n: 30     # U40: как valuation.min_obs_per_zone (ТЗ §7.3)
    simplify_deg: 0.001      # ST_Simplify полигонов для GeoJSON

# Дедупликация объявлений (ТЗ §8.1): сопоставление записей из разных
# источников в один физический объект. ТЗ: «радиус — из конфига по стране
# (плотная европейская застройка и пригород требуют разного)».
dedupe:
  by_country:
    # radius_m: 50 — «радиус 50 м из v1 сохраняется» (ТЗ §8.1).
    # area_tolerance_pct: 10 — допущение исполнителя (этап 3), менять здесь.
    # address_similarity: 0.9 — порог сходства нормализованных адресов;
    # совпадение только по адресу → match_confidence='low' (ТЗ §8.1).
    CZ: { radius_m: 50, area_tolerance_pct: 10, address_similarity: 0.9 }
    IT: { radius_m: 50, area_tolerance_pct: 10, address_similarity: 0.9 }
    NL: { radius_m: 50, area_tolerance_pct: 10, address_similarity: 0.9 }

# Сканер (этап 3): параметры вежливости при обходе страниц источника.
scan:
  # Пауза между запросами страниц категории, мс. Источник значения:
  # оператор — вежливый уровень для публичного сайта (ТЗ §0.1, §13).
  # 0 — пауза отключена (не рекомендуется).
  page_delay_ms: 1000

# Общий исходящий клиент источника (D20 + ТЗ-SRC-CZ-1 A6–A7).
source:
  # Минимальный интервал между любыми исходящими запросами к источнику, мс.
  request_interval_ms: 2000
  # Одна строка UA на пробы и сканы, та же что у bazos-reality.
  user_agent: "PropertyBoss/0.3 (real-estate price monitoring)"

# Гедоническая модель (этап 5, ТЗ §7.2–7.3, v4-2 §4.10). ТЗ §7.3: пороги —
# в конфиге, не в коде.
valuation:
  # Минимум наблюдений на параметр. ТЗ §7.3: «отраслевой ориентир — от 10
  # наблюдений на параметр»; 10 — нижняя граница ориентира.
  min_obs_per_param: 10
  # Зона с числом активных наблюдений меньше этого берёт zone_effect с
  # родительского уровня (zone_fallback=true, ТЗ §7.3). Допущение
  # исполнителя: 30 (полугодовой цикл OMI — данных мало по определению).
  min_obs_per_zone: 30
  # Порог покрытия ОБЯЗАТЕЛЬНОГО набора признаков модели (цена, площадь,
  # зона, тип недвижимости), (0,1]: покрытие по применимым объектам ниже
  # порога — модель не публикуется (ТЗ v4-2 §4.10.1; прежнее значение —
  # порог пропусков по всем атрибутам, отменён). Допущение: 0.5.
  max_missing_rate: 0.5
  # Обработка необязательного признака с высокой долей пропусков
  # (ТЗ v4-2 §4.10.2): level — признак остаётся в модели, пропуск кодируется
  # явным уровнем «не указано» (onehot — доп. колонка, числовой — индикатор
  # пропуска); рекомендовано ТЗ: пропуск несёт сведения, импутация запрещена.
  # exclude — признак исключается из модели, если доля пропусков выше
  # optional_exclude_rate. Допущение: level.
  optional_missing: level
  # (Только для exclude.) Доля пропусков, выше которой признак исключается
  # из модели, (0,1]. Допущение исполнителя: 0.8.
  optional_exclude_rate: 0.8
  # Порог уверенности атрибута, [0,1]: значение с уверенностью ниже порога
  # не участвует в оценке коэффициентов (ТЗ v4 §4.3, правило раздела 6).
  # Уверенность — из attribute_values; без строки provenance значение
  # считается пригодным. Допущение: 0.5.
  min_confidence: 0.5
  # Число складок k-fold CV для подбора λ (ТЗ §7.2: «λ подбирается
  # k-fold кросс-валидацией, а не назначается»). Допущение: 5.
  kfold: 5
  # Кандидаты λ для гребневой регуляризации, по возрастанию. Допущение:
  # стандартная логарифмическая сетка; регуляризация обязательна
  # (ТЗ §7.2: национальные атрибуты сильно коллинеарны).
  lambda_grid: [0.01, 0.1, 1, 10, 100]
  # C21: максимум числа обусловленности матрицы подгонки (XᵀX + λP).
  # Подгонка с cond выше порога или рангом ниже числа параметров
  # отвергается (degenerate_matrix): gonum Solve решает вырожденную
  # систему без ошибки. Допущение: 1e12.
  max_mat_cond: 1e12
  # C25: максимум доли not_modeled (объекты без уровня геокода —
  # структурно не моделируемы). Критерий — не «уровень у 100%», а
  # последствие: объект с флагом не показывает публикуемых оценок;
  # превышение порога — дефект. Порог — оператор (регламент §12): 2%.
  max_not_modeled_share: 0.02

# Delisted-логика (этап 6, ТЗ §8.2). Исчезновение из выдачи — не продажа:
# статус delisted ставится только по правилам ниже.
delist:
  # Сколько ПОСЛЕДОВАТЕЛЬНЫХ полных сканов без объекта нужно, чтобы
  # считать его исчезнувшим. ТЗ §8.2: «минимум 2» (1 неполный скан или
  # один сбой источника не должны «продавать» объект).
  min_consecutive_misses: 2
  # Защита от катастрофы (ТЗ §8.2): если за один прогон исчезает больше
  # этого процента активных объектов источника — прогон считается
  # аномальным: изменения не применяются, оператор уведомляется.
  # Допущение исполнителя: 25 (смена вёрстки сайта «продаёт» всю базу
  # разом — 25% за один прогон уже аномалия, а не естественный отток).
  max_delisted_share_pct: 25
  # Таймаут прямого URL-чека объявления перед delisted, с (ТЗ §8.2,
  # защита 4). 404/410 подтверждает исчезновение, живой список — объект
  # остаётся активным.
  url_check_timeout_sec: 10

# Модель ликвидности (этап 7, ТЗ §9): дискретная модель дожития на
# недельных person-period интервалах. Выход — вероятность ухода с рынка
# (НЕ продажи, §9.3), а не «коэффициент продаваемости».
liquidity:
  # Минимум завершённых наблюдений (объектов, ушедших с рынка) до
  # обучения модели. ТЗ §9.3: «пока не накоплено min_events —
  # hazard_probability = NULL с причиной insufficient_history».
  # Допущение исполнителя: 100 (с ~30 параметрами модели 100 событий —
  # нижняя граница осмысленного пулированного обучения).
  min_events: 100
  # Порог калибровки (ТЗ §9.4): модель публикуется, только если
  # максимальное отклонение калибровочной кривой по децилям предсказанной
  # вероятности не больше этого; иначе status=uncalibrated, прогноз NULL
  # с причиной calibration_failed, оповещения не отправляются.
  # Допущение исполнителя: 0.10 (10 процентных пунктов).
  max_calib_dev: 0.10
  # Горизонт прогноза T, дней: «вероятность ухода с рынка в ближайшие T
  # дней» (ТЗ §9.2). Недельная дискретизация: P(T) = 1 − ∏(1 − h_w)
  # по первым ceil(T/7) неделям. Допущение исполнителя: 30.
  horizon_days: 30
  # Доля хвоста окна наблюдений для отложенной по времени проверки
  # (ТЗ §9.4: обучение до T, проверка после T; случайное разбиение
  # запрещено — оно перемешивает будущее с прошлым). Допущение: 0.25.
  holdout_ratio: 0.25

# Telegram — доставка уведомлений (этап 8, ТЗ §2). Бот — только
# уведомления, диалога нет. Пока токен не задан (enabled: false),
# очередь notifications накапливается, и `pb notify send` явно
# сообщает, что доставка не настроена — алерты не теряются молча.
telegram:
  enabled: false
  # Токен бота — у @BotFather, хранится в config/secrets.yaml
  # (секреты не в общем конфиге). Коммитить реальные токены запрещено.
  # Чат оператора (числовой chat_id; у канала — @channel).
  chat_id: ""
  # Зеркало Bot API; дефолт https://api.telegram.org.
  base_url: "https://api.telegram.org"

# Триггеры уведомлений (этап 8, ТЗ §3.2).
notify:
  # Сколько сообщений доставить за один `pb notify send` (cron-точка,
  # ТЗ §3.4). 0 — дефолт 100.
  flush_limit: 100
  # Каталог с данными для проверки свободного места (ТЗ §3.2). Пусто —
  # проверка отключена. На Termux/Android-цели — каталог с базой и WAL.
  disk_path: ""
  # Свободного места меньше этого процента — алерт ДО критической
  # точки (ТЗ §3.2: «до достижения критического порога»). 10 —
  # допущение исполнителя: WAL-архив и pg_dump должны укладываться
  # с запасом, а не впритык.
  disk_critical_pct: 10
  # Минимальный интервал между повторными алертами о диске, мин.
  # 1440 (сутки) — допущение исполнителя: диск не наполняется
  # заметно за минуты, чаще — шум.
  disk_realert_minutes: 1440

# Адаптивное расписание сканирования (этап 11, ТЗ §10).
schedule:
  # Доля бюджета на исследование (ε, ТЗ §10.3): слот с нулевым выходом
  # не отключается — ему всегда достаётся ε доли веса (иначе система
  # никогда не узнает об изменении режима площадки).
  exploration_fraction: 0.10
  # Окно скользящего среднего выхода, дней (ТЗ §10.3).
  ma_window_days: 14
  # Минимум накопленных полных сканов по источнику, ниже которого
  # расписание работает на равных консервативных весах и помечается
  # warming_up (ТЗ §10.5).
  min_obs_for_tuning: 14
  # Бэкофф по капче/429 (ТЗ §10.4): кулдаун base * multiplier^(strikes-1)
  # с потолком max (последовательные неудачи без полного скана).
  backoff_base_minutes: 60
  backoff_multiplier: 2
  backoff_max_hours: 72
  # Постепенное восстановление: rate_factor (множитель потолка
  # max_requests_per_hour) падает вдвое при входе в кулдаун и
  # повышается на recovery_step при каждом полном скане до 1.0.
  recovery_step: 1.5
  min_rate_factor: 0.25
  # Часовой пояс страны объявления, IANA (ТЗ §10.2 — не сервера).
  country_timezones:
    CZ: Europe/Prague
    IT: Europe/Rome
    NL: Europe/Amsterdam

# Асинхронный переводчик описаний (этап 10, ТЗ §11). Переводы ru/en
# хранятся в object_translations, UI читает из БД (без обращения к LLM).
# Идемпотентность — по sha256(description_original): повторный перевод
# того же текста не выполняется, повторные траты при пересканировании
# исключены. Cron-точка: `pb translate run`. Пустой api_key — переводчик
# не настроен, `pb translate run` даёт явную ошибку (переводы NULL).
translate:
  # API-ключ LLM (OpenAI-совместимый API) — в config/secrets.yaml
  # (секреты не в общем конфиге). Пусто — переводчик не настроен.
  # Базовый URL OpenAI-совместимого API; дефолт https://api.openai.com/v1.
  base_url: "https://api.openai.com/v1"
  # Название модели — выбирает оператор (ТЗ модель не предписывает).
  # Обязателен при заданном api_key.
  model: ""
  # Таймаут запроса к LLM, с.
  timeout_sec: 60
  # Описание длиннее этого числа символов не отправляется в LLM
  # (стоимость в токенах); перевод остаётся NULL (ТЗ §11). Допущение
  # исполнителя: 4000.
  max_chars: 4000

# Детальный проход по объявлениям (ТЗ v4 §4): разбор страницы объявления
# до полного набора структурированных полей. Отдельный от category-скана
# (остаётся быстрым: новые/delisted/цена): `pb enrich` идёт по новым и
# изменённым объявлениям (изменение — по sha256 содержимого страницы).
detail:
  # Пауза между запросами страниц объявлений, мс (вежливость, ТЗ v2 §13).
  page_delay_ms: 1000
  # Таймаут одного запроса, с.
  timeout_sec: 30
  # Верхний предел фотографий на объявление; лишние не скачиваются.
  # Допущение исполнителя: 30.
  max_photos: 30
  # Уверенность правил извлечения из текста (ТЗ v4 §4.2: «уверенность —
  # из конфига правил»). Структурированный блок источника — source_field,
  # уверенность всегда 1.0 (это данные площадки, не правило).
  # title: 0.90 — заголовок короткий и контролируемый площадкой;
  # description: 0.80 — свободный текст, формулировки разнятся.
  rule_confidence_title: 0.90
  rule_confidence_description: 0.80

# LLM-извлечение атрибутов из описаний (ТЗ v4 §4.3). Только для атрибутов,
# не покрытых source_field/правилами; каждое значение программно
# валидируется по реестру (перечислимость, диапазоны). Догадки запрещены:
# пропуск допустим, изобретение — нет. Пустой api_key — не настроено:
# `pb extract run` даёт явную ошибку (ТЗ §0.4).
extract:
  # API-ключ LLM (OpenAI-совместимый API) — в config/secrets.yaml
  # (секреты не в общем конфиге).
  base_url: "https://api.openai.com/v1"
  # Название модели — выбирает оператор (ТЗ §0.1). Обязателен с api_key.
  model: ""
  timeout_sec: 60
  # Потолок уверенности LLM-значений (ТЗ v4 §4.3): модель сообщает
  # уверенность, выше потолка не поднимается; значения ниже порога
  # не входят в обучающую выборку. Допущение: 0.90.
  max_confidence: 0.90
  # Версия списка атрибутов: часть ключа идемпотентности (ТЗ v4 §4.3).
  # Бump при изменении состава реестра, чтобы старые переводы не
  # применялись к новому списку.
  attr_list_version: "cz-bazos-v1"
  # Описание длиннее этого не отправляется в LLM (стоимость).
  max_chars: 4000
  # Суммарный бюджет токенов (prompt + completion) за всё время: расход —
  # SUM(llm_extractions.tokens); при исчерпании прогон останавливается,
  # необработанные задачи остаются в очереди (ТЗ v4 §4.3). 0 — без лимита.
  budget_tokens: 0

# Геокодирование (ТЗ v4 §4.5): координаты + уровень их уверенности
# (building|street|municipality|postcode|zone). Координаты площадки
# («Přibližná lokalita» + zoom) — первичный источник: zoom — собственная
# декларация точности площадки, обращение к геокодеру не нужно (экономит
# лимит). Nominatim — только для адресов без координат площадки.
# Ложная точность запрещена (ТЗ v4 §0.5): UI отображает уровень —
# building/street как точку (street — с облаком), municipality/postcode
# как область, а не как точку.
geocode:
  # Реализован только nominatim; другое значение — явная ошибка.
  provider: nominatim
  base_url: "https://nominatim.openstreetmap.org"
  # Nominatim требует валидный User-Agent с контактом (политика
  # использования); без него запросы отклоняются.
  user_agent: "PropertyBoss/1.0 (personal research project; data: OpenStreetMap contributors, ODbL 1.0)"
  # Лимит запросов в минуту. Политика Nominatim: максимум 1 запрос/с;
  # 50 — с запасом. Больше 60 — конфиг отклоняется.
  rate_per_min: 50
  timeout_sec: 30
  # true — координаты площадки используются (и не тратится лимит).
  use_source_coords: true
  # Если уверенность площадки ниже этого уровня — геокодер по улице
  # из текста объявления (C10: zoom 12 = центроид PSČ, не улица).
  # Результат принимается только ≥ этого уровня (иначе оставляем PSČ).
  refine_below: street
  # zoom площадки → уровень уверенности: первое попавшее правило
  # (zoom >= zoom_min). Допущение исполнителя: >=16 — улица (площадка
  # зумит к участку/дому), 13–15 — муниципалитет, <=12 — почтовый
  # индекс (в Чехии координаты публикуются только с точностью PSČ).
  source_zoom_levels:
    - { zoom_min: 16, confidence: street }
    - { zoom_min: 13, confidence: municipality }
    - { zoom_min: 1,  confidence: postcode }
  # type результата Nominatim → уровень уверенности; неизвестный тип —
  # NULL (догадка запрещена).
  nominatim_type_levels:
    - { types: [house, building, premises, address], confidence: building }
    - { types: [road, street, footway, pedestrian, pathway, residential, living_street, tertiary, secondary, primary, unclassified, service, track, cycleway, path], confidence: street }
    - { types: [city, town, village, suburb, hamlet, city_district, borough], confidence: municipality }
    - { types: [postcode, postal_code], confidence: postcode }

# Фотографии (ТЗ v4 §4.4): оригинальная ссылка + два локальных размера
# (карта-карточка — больше, список — меньше), WebP. Только для личного
# использования: авторские права изображений принадлежат площадкам,
# redistribution запрещён (ТЗ v2 §13).
photos:
  # Каталог локальных копий относительно каталога проекта.
  dir: "data/photos"
  # Ширина локальных копий, px. Допущения исполнителя: 640 (карточка
  # на карте при ширине экрана 390px — с запасом под 2x) и 200 (список).
  card_width: 640
  list_width: 200
  # Качество WebP, 1..100. Допущение: 82.
  quality: 82
  # Максимальный вес одной локальной копии, байт (ТЗ v4 §4.4 — из
  # конфига). 500 КБ — допущение: при 640px WebP q82 типичное фото
  # укладывается в 50–200 КБ.
  max_bytes: 500000
  # Сколько первых фотографий объявления лежит локально (в обоих
  # размерах); остальные — оригинальные ссылки, галерея подгружает
  # лениво с площадки. 4 — допущение: обложка + список + карта + запас;
  # полный локальный архив (все фото всех объектов) — десятки гигабайт.
  max_local: 4
  # Параллельных загрузчиков. 1 — штатный прогон; 2–3 — бэкфилл.
  # > 4 отклоняется (вежливость к площадке).
  workers: 2
  timeout_sec: 60
  # Пауза между загрузками, мс (вежливость).
  page_delay_ms: 500

# Тип продавца (ТЗ v4 §4.7): структурированное поле → правило по
# признакам объявления → LLM с уверенностью. Маркеры — консервативный
# перечень: ложное срабатывание = «изобретённый» тип продавца, что
# запрещено (ТЗ v4 §0.4). Имя без маркеров — NULL (не private «по
# умолчанию»: частный агент без маркеров организации неопределён).
seller_rules:
  # Подстроки в имени продавца (без учёта регистра) → agency.
  agency_markers:
    - "realitní kancelář"
    - "realitni kancelar"
    - "realitace"
    - "s.r.o."
    - "s. r. o."
    - "a.s."
    - "společnost"
  # Явные заявления частного лица → private (прямое заявление,
  # уверенность выше маркерной).
  private_markers:
    - "přímý majitel"
    - "prímý majitel"
    - "jsem majitel"
    - "jsem přímý"
    - "realitní kanceláře nevolat"
    - "bez realitky"
    - "přímý prodej"
  # Подстроки в имени → developer (застройщик).
  developer_markers:
    - "stavební společnost"
    - "developer"
  # Уверенность правила (0..1). 0.9 для private: это прямое заявление
  # продавца, а не маркер.
  confidence_agency: 0.85
  confidence_private: 0.90
  confidence_developer: 0.85

fx:
  # Источник: ежедневные референсные курсы ЕЦБ, XML-фид eurofxref (ТЗ §5).
  # Проверено 2026-08-25:
  #   - SDMX REST API (data-api.ecb.europa.eu) блокируется WAF с IP сервера;
  #   - XML-фид доступен, но только с заголовком User-Agent.
  base_url: "https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml"
  user_agent: "PropertyBoss-FXLoader/1.0 (propertyboss backend)"
  # Глубина истории для первичной загрузки и восстановления после разрыва
  # (допущение: 30 дней, покрывает первое окно накопления наблюдений).
  backfill_days: 30
  # Зеркальный API тех же курсов ЕЦБ (frankfurter.dev, без ключа) для окна
  # бэкфила. Проверено 2026-08-25: собственные эндпоинты ЕЦБ
  # игнорируют параметры from/to с этой сети (отдают один день), прямой
  # XML-канал покрывает только последний опубликованный день. Данные —
  # референсные курсы ЕЦБ; в fx_rates.source путь атрибутируется явно.
  # Необязательно: без него синхронизация идёт только прямым каналом.
  fallback_base_url: "https://api.frankfurter.dev/v1"

# Резервное копирование (ТЗ-R1 R0.3, R0.4).
backup:
  dir: "~/backups/propertyboss"
  remote: "CHANGE_ME@remote-host:/path/to/backup"
  ssh_key: "~/.ssh/pb_backup"
  keep_local: 14
  keep_remote: 30
  test_db: "pb_restore_test"

