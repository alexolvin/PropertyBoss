# Секреты PropertyBoss. НЕ коммитится: config/secrets.yaml — в .gitignore.
#
# Скопируйте в config/secrets.yaml (рядом с config/config.yaml) и
# заполните. config.Load читает этот файл и подмешивает значения
# поверх config.yaml — секреты в общий конфиг класть не нужно
# (приоритет — у secrets.yaml). Шаблон коммитится, сам secrets.yaml — нет.

database:
  # DSN PostgreSQL с паролем (ТЗ §2, этап 1).
  dsn: "postgres://propertyboss:CHANGE_ME@127.0.0.1:5432/propertyboss?sslmode=disable"

telegram:
  # Токен бота, у @BotFather (этап 8, ТЗ §2). Коммитить реальные токены
  # запрещено.
  token: ""

translate:
  # API-ключ LLM (OpenAI-совместимый API, этап 10, ТЗ §11). Пусто —
  # переводчик не настроен (явная ошибка при `pb translate run`).
  api_key: ""

extract:
  # API-ключ LLM (ТЗ v4 §4.3). Пусто — извлечение не настроено (явная
  # ошибка при `pb extract run`).
  api_key: ""
